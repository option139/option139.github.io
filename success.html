<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TJP56 - Akses Dibuka</title>
  <style>
    body { 
      font-family: sans-serif; 
      margin: 0;
      padding: 0;
      line-height: 1.6;
      background: #f6f8fa;
      overflow: hidden;
    }
    #subscribe-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.96);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .popup-box {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 12px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      font-family: sans-serif;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .popup-box h2 {
      margin: 0 0 15px 0;
      color: #24292e;
      font-size: 24px;
    }
    .popup-box p {
      color: #57606a;
      margin: 0 0 25px 0;
      font-size: 15px;
      line-height: 1.5;
    }
    .btn-yt {
      background: #ff0000;
      color: #fff;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      display: inline-block;
      font-size: 16px;
      width: 80%;
    }
    .btn-tele {
      background: #0088cc;
      color: #fff;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      display: inline-block;
      font-size: 16px;
      width: 80%;

<body>

  <!-- POP-UP SUBSCRIBE LOCK - INI JADI HALAMAN UTAMANYA -->
  <div id="subscribe-popup">

  <script>

    history.go(1);
  };
  
  // 2. Cegah refresh ilangin popup. Halaman ini emang popup-nya.
  document.body.style.overflow = 'hidden';
