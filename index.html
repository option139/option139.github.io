<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribe Tirto Agung</title>
  <style>
    * {margin:0;padding:0;box-sizing:border-box;}
    body {background:#0f0f0f;color:white;font-family:Arial,sans-serif;height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;overflow:hidden;}
    .container{padding:20px;}
    h1{font-size:24px;margin-bottom:30px;color:#fff;}
    .btn-sub{background:#ff0000;color:white;border:none;padding:20px 40px;font-size:22px;font-weight:bold;border-radius:8px;cursor:pointer;animation:pulse 1.5s infinite;text-decoration:none;display:inline-block;}
    .btn-sub:hover{background:#cc0000;}
    @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
    .kecil{margin-top:25px;font-size:12px;color:#aaa;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Klik Subscribe dulu buat lanjut</h1>
    <a href="https://www.youtube.com/@tirtoagung9247?sub_confirmation=1" class="btn-sub" onclick="gaskeun(event)">
      SUBSCRIBE SEKARANG
    </a>
    <p class="kecil">Lu bakal diarahkan ke YouTube</p>
  </div>

  <script>
    // Trik 1: Spam history biar tombol back mental terus
    function jebakBack() {
      history.pushState(null, null, location.href);
      history.pushState(null, null, location.href);
      history.pushState(null, null, location.href);
    }
    
    jebakBack();
    window.addEventListener('popstate', function() {
      jebakBack();
    });

    // Trik 2: Pas klik, pake replace + hapus warning biar langsung kabur
    function gaskeun(e) {
      e.preventDefault();
      window.onbeforeunload = null;
      window.location.replace("https://www.youtube.com/@tirtoagung9247?sub_confirmation=1");
    }

    // Trik 3: Warning kalo mau close
    window.onbeforeunload = function() {
      return "Subscribe dulu lah bro";
    };

    // Trik 4: Kalo dia diem 3 detik, spam history lagi
    setInterval(jebakBack, 3000);
  </script>
</body>
</html>
