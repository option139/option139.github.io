<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TJP56 - Daftar</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; }
    input { padding: 12px; width: 250px; margin: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 12px 24px; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #888; }
  </style>
</head>
<body>

  <h2>Masukin Email Lu Bro</h2>
  <p>Dapetin akses TJP56 sekarang</p>
  <form id="leadForm">
    <input type="email" id="email" placeholder="email@tjp56.com" required>
    <br>
    <button type="submit" id="submitBtn">Gas Kirim</button>
  </form>

  <script>
    const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwjBaY2aGJ1Qnfc3LLXaMilEtOrqPJY-Faek0OgXcPRVKbxfLYcIoSXN7o_tpcpbTzMew/exec';
    
    document.getElementById('leadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Ngirim...';

      // 1. Tembak webhook dulu
      fetch(WEBHOOK_URL + '?email=' + encodeURIComponent(email))
        .finally(() => {
          // 2. Pake location.replace biar history ketimpa. BACK GA BISA BALIK.
          window.location.replace('success.html');
        });
    });
  </script>

</body>
</html>
